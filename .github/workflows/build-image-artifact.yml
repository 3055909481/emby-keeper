name: Build Docker Image Artifact

on:
  workflow_dispatch:   # 仍可随时手动触发
  push:                # 源码/部署脚本变更时自动构建一次，避免每次改 docs 误跑
    branches: [main]
    paths:
      - 'embykeeper/**'
      - 'deploy/panel/**'
      - 'frontend/**'
      - '.github/workflows/build-image-artifact.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image to tar
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/panel/Dockerfile
          target: release
          platforms: linux/amd64          # 若服务器是 ARM 请改成 linux/arm64
          tags: my-embykeeper:latest
          outputs: type=docker,dest=/tmp/embykeeper-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: embykeeper-image
          path: /tmp/embykeeper-image.tar
          retention-days: 7
